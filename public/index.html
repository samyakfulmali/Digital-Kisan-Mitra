    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .spinner-small { border: 3px solid #f3f3f3; border-top: 3px solid #16a34a; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }

<body class="bg-gray-50">
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;">
      <div class="spinner"></div>
      <p style="margin-top:16px;color:#666;">Loading Digital Kisan Mitra...</p>
    </div>
  </div>
  <script src="react.min.js"></script>
  <script src="react-dom.min.js"></script>
  <script src="babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useContext, createContext, useRef } = React;
    const API_URL = 'http://localhost:5000/api';

    // ============ LOCAL DATA SERVICE (No Backend Needed!) ============
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    
    const db = {
      getUsers: () => JSON.parse(localStorage.getItem('kisan_users') || '[]'),
      saveUsers: (users) => localStorage.setItem('kisan_users', JSON.stringify(users)),
      getCrops: () => JSON.parse(localStorage.getItem('kisan_crops') || '[]'),
      saveCrops: (crops) => localStorage.setItem('kisan_crops', JSON.stringify(crops))
    };

    const api = {
      post: async (url, data) => {
        await delay(300);
        if (url === '/auth/register') {
          const users = db.getUsers();
          if (users.find(u => u.mobileNumber === data.mobileNumber)) {
            return { success: false, message: 'Mobile number already registered' };
          }
          const newUser = { _id: Date.now().toString(), ...data, password: btoa(data.password), createdAt: new Date().toISOString() };
          users.push(newUser);
          db.saveUsers(users);
          const { password, ...userWithoutPassword } = newUser;
          return { success: true, data: { user: userWithoutPassword, token: 'local-token-' + newUser._id } };
        }
        if (url === '/auth/login') {
          const users = db.getUsers();
          const user = users.find(u => u.mobileNumber === data.mobileNumber);
          if (!user || atob(user.password) !== data.password) {
            return { success: false, message: 'Invalid credentials' };
          }
          const { password, ...userWithoutPassword } = user;
          return { success: true, data: { user: userWithoutPassword, token: 'local-token-' + user._id } };
        }
        if (url === '/crops') {
          const user = JSON.parse(localStorage.getItem('user') || 'null');
          if (!user) return { success: false, message: 'Not logged in' };
          const newCrop = { _id: Date.now().toString(), farmerId: user._id, ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
          const crops = db.getCrops();
          crops.push(newCrop);
          db.saveCrops(crops);
          return { success: true, data: newCrop };
        }
        return { success: false, message: 'Endpoint not found' };
      },
      get: async (url) => {
        await delay(200);
        if (url.startsWith('/farmer/profile')) {
          const user = JSON.parse(localStorage.getItem('user') || 'null');
          if (!user) return { success: false, message: 'Not logged in' };
          return { success: true, data: user };
        }
        if (url === '/crops') {
          const user = JSON.parse(localStorage.getItem('user') || 'null');
          if (!user) return { success: false, message: 'Not logged in' };
          const crops = db.getCrops().filter(c => c.farmerId === user._id);
          return { success: true, data: crops };
        }
        if (url.startsWith('/analytics/dashboard')) {
          const user = JSON.parse(localStorage.getItem('user') || 'null');
          if (!user) return { success: false, message: 'Not logged in' };
          const crops = db.getCrops().filter(c => c.farmerId === user._id);
          return { success: true, data: { totalCrops: crops.length, activeCrops: crops.filter(c => ['planting', 'growing'].includes(c.status)).length } };
        }
        if (url.startsWith('/weather/current')) {
          return { success: true, data: { temperature: 28, humidity: 65, windSpeed: 12, condition: 'Partly Cloudy', precipitation: 2, location: 'Pune, Maharashtra', timestamp: new Date().toISOString() } };
        }
        if (url.startsWith('/weather/forecast')) {
          const conditions = ['Sunny', 'Partly Cloudy', 'Cloudy', 'Light Rain'];
          const forecast = [];
          for (let i = 0; i < 7; i++) {
            const date = new Date();
            date.setDate(date.getDate() + i);
            forecast.push({ date: date.toISOString(), condition: conditions[Math.floor(Math.random() * conditions.length)], minTemp: 20 + Math.floor(Math.random() * 5), maxTemp: 28 + Math.floor(Math.random() * 8), humidity: 55 + Math.floor(Math.random() * 30), windSpeed: 8 + Math.floor(Math.random() * 15), precipitationChance: Math.floor(Math.random() * 100) });
          }
          return { success: true, data: forecast };
        }
        if (url.startsWith('/mandi/prices')) {
          const params = new URLSearchParams(url.split('?')[1] || '');
          const cropFilter = params.get('crop');
          const marketFilter = params.get('market');
          const crops = ['Rice', 'Wheat', 'Cotton', 'Sugarcane', 'Onion', 'Tomato', 'Potato', 'Soybean'];
          const markets = ['Mumbai', 'Delhi', 'Pune', 'Nashik', 'Bangalore', 'Chennai', 'Kolkata'];
          const units = { Rice: 'quintal', Wheat: 'quintal', Cotton: 'quintal', Sugarcane: 'quintal', Onion: 'quintal', Tomato: 'quintal', Potato: 'quintal', Soybean: 'quintal' };
          const basePrices = { Rice: 2200, Wheat: 2400, Cotton: 6500, Sugarcane: 350, Onion: 1800, Tomato: 1200, Potato: 900, Soybean: 4200 };
          const prices = [];
          const cropList = cropFilter ? [cropFilter] : crops;
          const marketList = marketFilter ? [marketFilter] : markets;
          cropList.forEach(c => {
            marketList.forEach(m => {
              const basePrice = basePrices[c] || 2000;
              const variation = (Math.random() - 0.5) * 0.2;
              const price = basePrice * (1 + variation);
              const change = (Math.random() - 0.5) * 100;
              prices.push({ id: `${c}-${m}`, cropId: c.toLowerCase(), cropName: c, marketId: m.toLowerCase(), marketName: `${m} Mandi`, price: Math.round(price * 100) / 100, unit: units[c] || 'quintal', change: Math.round(change * 100) / 100, changePercent: Math.round((change / basePrice) * 10000) / 100, updatedAt: new Date().toISOString() });
            });
          });
          return { success: true, data: prices };
        }
        return { success: false, message: 'Endpoint not found' };
      },
      put: async (url, data) => {
        await delay(300);
        if (url === '/farmer/profile') {
          const user = JSON.parse(localStorage.getItem('user') || 'null');
          if (!user) return { success: false, message: 'Not logged in' };
          const updated = { ...user, ...data };
          localStorage.setItem('user', JSON.stringify(updated));
          const users = db.getUsers();
          const idx = users.findIndex(u => u._id === user._id);
          if (idx >= 0) { users[idx] = { ...users[idx], ...data }; db.saveUsers(users); }
          return { success: true, data: updated };
        }
        if (url === '/farmer/change-password') {
          const user = JSON.parse(localStorage.getItem('user') || 'null');
          if (!user) return { success: false, message: 'Not logged in' };
          const users = db.getUsers();
          const idx = users.findIndex(u => u._id === user._id);
          if (idx < 0) return { success: false, message: 'User not found' };
          if (atob(users[idx].password) !== data.currentPassword) return { success: false, message: 'Current password is incorrect' };
          users[idx].password = btoa(data.newPassword);
          db.saveUsers(users);
          return { success: true, message: 'Password changed successfully' };
        }
        if (url.startsWith('/crops/')) {
          const id = url.split('/')[2];
          const crops = db.getCrops();
          const idx = crops.findIndex(c => c._id === id);
          if (idx < 0) return { success: false, message: 'Crop not found' };
          crops[idx] = { ...crops[idx], ...data, updatedAt: new Date().toISOString() };
          db.saveCrops(crops);
          return { success: true, data: crops[idx] };
        }
        return { success: false, message: 'Endpoint not found' };
      },
      del: async (url) => {
        await delay(200);
        if (url.startsWith('/crops/')) {
          const id = url.split('/')[2];
          const crops = db.getCrops().filter(c => c._id !== id);
          db.saveCrops(crops);
          return { success: true, message: 'Crop deleted' };
        }
        return { success: false, message: 'Endpoint not found' };
      }
    };

    const useI18n = () => {
      const [lang, setLang] = useState(localStorage.getItem('lang') || 'en');
      const setLanguage = (l) => { setLang(l); localStorage.setItem('lang', l); };
      const t = (key, params) => {
        let str = translations[lang][key] || translations.en[key] || key;
        if (params) Object.keys(params).forEach(k => str = str.replace(`{${k}}`, params[k]));
        return str;
      };
      return { t, lang, setLanguage };
    };

      const [showForm, setShowForm] = useState(false);
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ name: '', variety: '', area: '', plantingDate: '', expectedHarvest: '', status: 'planting' });
      const [deleteId, setDeleteId] = useState(null);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState('');
      const fetchCrops = async () => { setLoading(true); const res = await api.get('/crops'); if (res.success) setCrops(res.data); setLoading(false); };
      useEffect(() => { fetchCrops(); }, []);
      const handleSubmit = async (e) => {
        e.preventDefault(); setError(''); setSubmitting(true);
        const res = editing ? await api.put('/crops/' + editing._id, form) : await api.post('/crops', form);
        setSubmitting(false);
        if (res.success) { setShowForm(false); setEditing(null); setForm({ name: '', variety: '', area: '', plantingDate: '', expectedHarvest: '', status: 'planting' }); fetchCrops(); }
        else setError(res.message);
      };
      const handleDelete = async () => { const res = await api.del('/crops/' + deleteId); if (res.success) { setDeleteId(null); fetchCrops(); } };
      if (loading) return <div className="flex h-64 items-center justify-center"><Spinner /></div>;
      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <h1 className="text-2xl font-bold">{t('cropManagement')}</h1>
            <Button onClick={() => { setShowForm(true); setEditing(null); setForm({ name: '', variety: '', area: '', plantingDate: '', expectedHarvest: '', status: 'planting' }); setError(''); }}>➕ {t('addCrop')}</Button>
          </div>
          {showForm && (
            <Card>
              <form onSubmit={handleSubmit} className="p-5 grid grid-cols-1 md:grid-cols-2 gap-x-4">
                <Input label={t('cropName')} value={form.name} onChange={e => setForm({...form, name: e.target.value})} required />
                <Input label={t('variety')} value={form.variety} onChange={e => setForm({...form, variety: e.target.value})} />
                <Input label={t('area')} type="number" step="0.1" value={form.area} onChange={e => setForm({...form, area: e.target.value})} />
                <Select label={t('status')} value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
                  <option value="planting">{t('planting')}</option>
                  <option value="growing">{t('growing')}</option>
                  <option value="readyForHarvest">{t('readyForHarvest')}</option>
                  <option value="harvested">{t('harvested')}</option>
                </Select>
                <Input label={t('plantingDate')} type="date" value={form.plantingDate?.split('T')[0] || ''} onChange={e => setForm({...form, plantingDate: e.target.value})} />
                <Input label={t('expectedHarvest')} type="date" value={form.expectedHarvest?.split('T')[0] || ''} onChange={e => setForm({...form, expectedHarvest: e.target.value})} />
                {error && <div className="md:col-span-2 bg-red-50 border border-red-200 text-red-800 px-3 py-2 rounded text-sm">{error}</div>}
                <div className="md:col-span-2 flex gap-2">
                  <Button type="submit" disabled={submitting} className="flex-1">{submitting ? <><Spinner size="small" /></> : (editing ? t('saveChanges') : t('add'))}</Button>
                  <Button type="button" variant="secondary" onClick={() => { setShowForm(false); setEditing(null); }} className="flex-1">{t('cancel')}</Button>
                </div>
              </form>
            </Card>
          )}
          {crops.length === 0 ? <Card><div className="p-12 text-center text-gray-500"><div className="text-5xl mb-3">🌾</div><p>{t('noCrops')}</p><Button onClick={() => setShowForm(true)} className="mt-4">{t('addFirstCrop')}</Button></div></Card> : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {crops.map(c => (
                <Card key={c._id} className="p-5">
                  <div className="flex justify-between items-start mb-2">
                    <h3 className="font-semibold text-gray-900">{c.name}</h3>
                    <span className="px-2 py-0.5 bg-green-100 text-green-800 text-xs rounded-full font-medium">{c.status}</span>
                  </div>
                  <p className="text-sm text-gray-600 mb-1">🌱 {c.variety || 'No variety specified'}</p>
                  <p className="text-sm text-gray-600 mb-1">📏 {c.area || 0} acres</p>
                  <p className="text-xs text-gray-500">🌿 Planted: {c.plantingDate ? new Date(c.plantingDate).toLocaleDateString() : 'Not set'}</p>
                  <div className="flex gap-2 mt-4">
                    <Button variant="secondary" onClick={() => { setEditing(c); setForm({...c, plantingDate: c.plantingDate?.split('T')[0] || '', expectedHarvest: c.expectedHarvest?.split('T')[0] || ''}); setShowForm(true); setError(''); }} className="flex-1 text-sm">✏️ {t('edit')}</Button>
                    <Button variant="danger" onClick={() => setDeleteId(c._id)} className="flex-1 text-sm">🗑️ {t('delete')}</Button>
                  </div>
                </Card>
              ))}
            </div>
          )}
          {deleteId && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <Card className="p-6 max-w-sm w-full">
                <h3 className="font-bold text-lg mb-2">⚠️ {t('confirmDelete')}</h3>
                <p className="text-gray-600 mb-4 text-sm">{t('deleteCropConfirm')}</p>
                <div className="flex gap-2">
                  <Button variant="secondary" onClick={() => setDeleteId(null)} className="flex-1">{t('cancel')}</Button>
                  <Button variant="danger" onClick={handleDelete} className="flex-1">{t('delete')}</Button>
                </div>
              </Card>
            </div>
          )}
        </div>
      );
    };

    const WeatherPage = () => {
      const { t } = useI18n();
      const [weather, setWeather] = useState(null);
      const [forecast, setForecast] = useState([]);
      const [loading, setLoading] = useState(true);
      useEffect(() => {
        Promise.all([api.get('/weather/current?location=Pune'), api.get('/weather/forecast?days=7')]).then(([c, f]) => {
          if (c.success) setWeather(c.data);
          if (f.success) setForecast(f.data);
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);
      if (loading) return <div className="flex h-64 items-center justify-center"><Spinner /></div>;
      const getIcon = (c) => c?.includes('Rain') ? '🌧️' : c?.includes('Cloud') ? '☁️' : c?.includes('Thunder') ? '⛈️' : '☀️';
      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
          <h1 className="text-2xl font-bold text-center">{t('weather')}</h1>
          {weather && (
            <Card className="overflow-hidden">
              <div className="bg-gradient-to-br from-blue-400 to-blue-600 p-8 text-white text-center">
                <div className="text-7xl mb-3">{getIcon(weather.condition)}</div>
                <h2 className="text-2xl font-bold mb-1">{weather.temperature}°C</h2>
                <p className="text-blue-100">{weather.condition}</p>
                <p className="text-sm text-blue-200 mt-1">📍 {weather.location}</p>
              </div>
              <div className="grid grid-cols-3 divide-x divide-gray-100">
                <div className="p-4 text-center"><p className="text-2xl font-bold text-gray-900">{weather.humidity}%</p><p className="text-xs text-gray-500 mt-1">{t('humidity')}</p></div>
                <div className="p-4 text-center"><p className="text-2xl font-bold text-gray-900">{weather.windSpeed}</p><p className="text-xs text-gray-500 mt-1">{t('windSpeed')} (km/h)</p></div>
                <div className="p-4 text-center"><p className="text-2xl font-bold text-gray-900">{weather.precipitation}</p><p className="text-xs text-gray-500 mt-1">{t('precipitation')} (mm)</p></div>
              </div>
            </Card>
          )}
          {forecast.length > 0 && (
            <Card>
              <div className="p-5 border-b border-gray-100"><h2 className="font-semibold">📅 {t('forecast')}</h2></div>
              <div className="divide-y divide-gray-100">
                {forecast.map((day, i) => (
                  <div key={i} className="p-4 flex justify-between items-center hover:bg-gray-50">
                    <div className="flex items-center gap-3">
                      <div className="text-3xl">{getIcon(day.condition)}</div>
                      <div><p className="font-medium text-gray-900">{i === 0 ? t('forecast') + ' - ' + (i+1) : new Date(day.date).toLocaleDateString(undefined, { weekday: 'long' })}</p><p className="text-sm text-gray-500">{day.condition}</p></div>
                    </div>
                    <div className="text-right"><p className="font-bold text-gray-900">{day.maxTemp}° / {day.minTemp}°</p><p className="text-xs text-blue-600">💧 {day.precipitationChance}%</p></div>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    };

    const MandiPricePage = () => {
      const { t } = useI18n();
      const [prices, setPrices] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filters, setFilters] = useState({ crop: '', market: '' });
      useEffect(() => {
        const params = new URLSearchParams(Object.entries(filters).filter(([_,v]) => v)).toString();
        api.get('/mandi/prices' + (params ? '?' + params : '')).then(res => { if (res.success) setPrices(res.data); setLoading(false); }).catch(() => setLoading(false));
      }, [filters]);
      if (loading) return <div className="flex h-64 items-center justify-center"><Spinner /></div>;
      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
          <h1 className="text-2xl font-bold text-center">💰 {t('mandiPrices')}</h1>
          <Card className="p-5">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <Select label={t('selectCrop')} value={filters.crop} onChange={e => setFilters({...filters, crop: e.target.value})}>
                <option value="">{t('allCrops')}</option>
                {['Rice', 'Wheat', 'Cotton', 'Sugarcane', 'Onion', 'Tomato', 'Potato', 'Soybean'].map(c => <option key={c} value={c}>{c}</option>)}
              </Select>
              <Select label={t('selectMarket')} value={filters.market} onChange={e => setFilters({...filters, market: e.target.value})}>
                <option value="">{t('allMarkets')}</option>
                {['Mumbai', 'Delhi', 'Pune', 'Nashik', 'Bangalore', 'Chennai', 'Kolkata'].map(m => <option key={m} value={m}>{m}</option>)}
              </Select>
              <div className="flex items-end"><Button onClick={() => setFilters({...filters})} className="w-full">{t('applyFilters')}</Button></div>
            </div>
          </Card>
          {prices.length === 0 ? <Card><div className="p-12 text-center text-gray-500"><div className="text-5xl mb-3">💰</div><p>{t('noData')}</p></div></Card> : (
            <Card>
              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead className="bg-gray-50 border-b border-gray-100">
                    <tr>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('selectCrop')}</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('selectMarket')}</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('price')}</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('change')}</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {prices.slice(0, 30).map(p => (
                      <tr key={p.id} className="hover:bg-gray-50">
                        <td className="px-4 py-3 font-medium text-gray-900">{p.cropName}</td>
                        <td className="px-4 py-3 text-gray-600">{p.marketName}</td>
                        <td className="px-4 py-3 font-bold text-gray-900">₹{p.price}<span className="text-xs text-gray-500 font-normal">/{p.unit}</span></td>
                        <td className="px-4 py-3"><span className={`font-medium ${p.change >= 0 ? 'text-green-600' : 'text-red-600'}`}>{p.change >= 0 ? '▲ +' : '▼ '}{Math.abs(p.change).toFixed(2)} <span className="text-xs">({Math.abs(p.changePercent).toFixed(1)}%)</span></span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          )}
        </div>
      );
    };

    // ============ MAIN APP ============
    const App = () => {
      const [page, setPage] = useState('login');
      const { user, loading } = useAuth();
      if (loading) return <div className="flex h-screen items-center justify-center"><Spinner /></div>;
      const navigate = (p) => {
        if (!user && !['login', 'register'].includes(p)) { setPage('login'); return; }
        if (user && ['login', 'register'].includes(p)) { setPage('dashboard'); return; }
        setPage(p);
        window.scrollTo(0, 0);
      };
      const renderPage = () => {
        if (!user) return page === 'register' ? <RegisterPage onNavigate={navigate} /> : <LoginPage onNavigate={navigate} />;
        switch(page) {
          case 'profile': return <ProfilePage />;
          case 'crops': return <CropManagementPage />;
          case 'weather': return <WeatherPage />;
          case 'mandi': return <MandiPricePage />;
          case 'dashboard':
          default: return <DashboardPage onNavigate={navigate} />;
        }
      };
      return (
        <div className="min-h-screen flex flex-col bg-gray-50">
          <Header onNavigate={navigate} />
          <main className="flex-1">{renderPage()}</main>
          <Footer />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuthProvider><App /></AuthProvider>);
  </script>
</body>
</html>
